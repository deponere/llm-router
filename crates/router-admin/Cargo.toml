[package]
name = "router-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Headless config bridge for the macOS admin app.
#   router-admin dump  <toml-path>   -> prints the config as JSON on stdout
#   router-admin apply <toml-path>   -> reads config JSON on stdin, writes it
#                                       back into the TOML *in place*, keeping
#                                       comments and key order (toml_edit).

[[bin]]
name = "router-admin"
path = "src/main.rs"

[dependencies]
router-config.workspace = true
serde_json.workspace = true
anyhow.workspace = true
toml_edit = "0.22"
sha2 = { workspace = true }
