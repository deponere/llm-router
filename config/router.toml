# LLM-Router Configuration
# Alle Preise in USD pro 1 Million Tokens.
# Alle Latenzen in Millisekunden.

[server]
bind = "127.0.0.1:4000"

[backends.openrouter]
enabled = true
api_key_env = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api/v1"
# HTTP-Referer und X-Title sind optional, erscheinen in OpenRouter-Stats.
app_referer = "https://localhost/router"
app_title = "deponere_router"

[backends.omlx]
enabled = true
base_url_env = "OMLX_HOST"
base_url_default = "http://127.0.0.1:8000"
api_key_env = "OMLX_API_KEY"

# Overlay ueber die vom jeweiligen Backend gelieferten Modell-Metadaten.
# Wird gebraucht, wenn /v1/models keine oder unvollstaendige Capability-Angaben
# liefert.
[[registry.overrides]]
backend = "OMlx"
id_prefix = "qwen3"
input_modalities = ["text"]
caps = ["tools"]

[[registry.overrides]]
backend = "OMlx"
id_prefix = "qwen2.5-coder"
input_modalities = ["text"]
caps = ["tools"]

[[registry.overrides]]
backend = "OMlx"
id_prefix = "llama-3.3"
input_modalities = ["text"]
caps = ["tools"]

[[registry.overrides]]
backend = "OMlx"
id_prefix = "qwen2.5-vl"
input_modalities = ["text", "image"]
caps = []

# Privacy-Klassifizierung pro OpenRouter-Provider-Slug (top-level Slug in model.id).
# Provider, die hier nicht auftauchen, gelten als "Standard".
[registry.privacy]
local = []
zdr = ["anthropic", "openai", "google"]

# ---------------- Profile ----------------

# Beispiel für ein eigenes Profil mit Modell-Allowlist:
# [profiles.only_claude]
# weights = { cost = 0.3, latency = 0.3, context = 0.2, preference = 0.2 }
# model_allowlist = ["anthropic/*"]            # nur Anthropic-Modelle
# provider_require_parameters = true
#
# Oder mit Denylist (bestimmte Modelle ausschliessen):
# model_denylist = ["openai/gpt-3*", "*free*"]
#
# Wildcards: * = beliebige Zeichenfolge, Muster gegen die volle model.id

[profiles.default]
weights = { cost = 0.35, latency = 0.25, context = 0.15, preference = 0.25 }
provider_require_parameters = true

[profiles.cheap]
weights = { cost = 0.9, latency = 0.05, context = 0.05, preference = 0.0 }
max_price_out_per_mtok = 2.0
provider_sort = "price"
provider_require_parameters = true

[profiles.fast]
weights = { cost = 0.1, latency = 0.7, context = 0.1, preference = 0.1 }
max_latency_p95_ms = 1500
provider_sort = "latency"
provider_require_parameters = true

[profiles.private]
weights = { cost = 0.2, latency = 0.2, context = 0.2, preference = 0.4 }
require_privacy_class = ["Local", "Zdr"]
provider_zdr = true
provider_allow_fallbacks = false
provider_data_collection = "deny"
provider_require_parameters = true

[profiles.smart]
weights = { cost = 0.0, latency = 0.2, context = 0.3, preference = 0.5 }
preferences = [
    "anthropic/claude-opus-4-7",
    "anthropic/claude-opus-4-6",
    "openai/gpt-5",
    "google/gemini-2.5-pro",
]
provider_require_parameters = true
# provider_quantizations greift nur fuer Open-Weight-Modelle (Llama, Qwen, ...)
# und wuerde proprietaere Modelle wie Claude/GPT/Gemini ausfiltern. Wenn du
# speziell Open-Weight-Varianten bevorzugen willst, aktiviere es in einem
# eigenen Profil, z. B. [profiles.smart_open_weight].
# provider_quantizations = ["fp16", "bf16", "fp8"]

[profiles.local]
weights = { cost = 0.0, latency = 0.5, context = 0.2, preference = 0.3 }
backend_allowlist = ["OMlx"]
preferences = [
    "qwen3-32b",
    "llama-3.3-70b",
    "qwen2.5-coder-32b",
]
