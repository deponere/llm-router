# LLM-Router Configuration
# Alle Preise in USD pro 1 Million Tokens.
# Alle Latenzen in Millisekunden.

[server]
bind = "127.0.0.1:4000"

[backends.openrouter]
enabled = true
api_key_env = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api/v1"
# HTTP-Referer und X-Title sind optional, erscheinen in OpenRouter-Stats.
app_referer = "https://localhost/router"
app_title = "deponere_router"

[backends.omlx]
enabled = true
base_url_env = "OMLX_HOST"
base_url_default = "http://127.0.0.1:8000"
api_key_env = "OMLX_API_KEY"

# Overlay ueber die vom jeweiligen Backend gelieferten Modell-Metadaten.
# Wird gebraucht, wenn /v1/models keine oder unvollstaendige Capability-Angaben
# liefert.
[[registry.overrides]]
backend = "OMlx"
id_prefix = "qwen3"
input_modalities = ["text"]
caps = ["tools"]

[[registry.overrides]]
backend = "OMlx"
id_prefix = "qwen2.5-coder"
input_modalities = ["text"]
caps = ["tools"]

[[registry.overrides]]
backend = "OMlx"
id_prefix = "llama-3.3"
input_modalities = ["text"]
caps = ["tools"]

[[registry.overrides]]
backend = "OMlx"
id_prefix = "qwen2.5-vl"
input_modalities = ["text", "image"]
caps = []

# Privacy-Klassifizierung pro OpenRouter-Provider-Slug (top-level Slug in model.id).
# Provider, die hier nicht auftauchen, gelten als "Standard".
[registry.privacy]
local = []
zdr = ["anthropic", "openai", "google"]

# Artificial-Analysis-Anbindung. Wenn enabled = true und AA_API_KEY gesetzt,
# wird der Intelligence-Index pro Modell gezogen (Cache 24h, max 1000 Calls/Tag).
# Der Score-Term `quality` greift in jedem Profil mit weights.quality > 0.
# Übersicht: GET /v1/intelligence
[registry.intelligence]
enabled = true
api_key_env = "AA_API_KEY"
base_url = "https://artificialanalysis.ai/api/v2"
ttl_seconds = 86400

# Optionales Mapping Router-Modell-ID -> AA-Slug. Vorrang vor der Heuristik
# (Suffix nach `/`, lowercase, Punkt -> Bindestrich).
# Wichtig fuer oMLX: backend-spezifische IDs (mit Quantisierungs-Suffix) muessen
# auf den generischen Architektur-Slug bei AA gemappt werden. Die AA-Bewertung
# entspricht dem unquantisierten Modell — fuer 4bit/8bit ist das ein optimist.
# Proxy.
[registry.intelligence.aliases]
"Qwen3.6-35B-A3B-bf16" = "qwen3-6-35b-a3b"
"gemma-4-26B-A4B-it-MLX-8bit" = "gemma-4-26b-a4b"
"gemma-4-e2b-it-4bit" = "gemma-4-e2b"
"gpt-oss-20b-MXFP4-Q8" = "gpt-oss-20b"

# ---------------- Profile ----------------

# Beispiel für ein eigenes Profil mit Modell-Allowlist:
# [profiles.only_claude]
# weights = { cost = 0.3, latency = 0.3, context = 0.2, preference = 0.2 }
# model_allowlist = ["anthropic/*"]            # nur Anthropic-Modelle
# provider_require_parameters = true
#
# Oder mit Denylist (bestimmte Modelle ausschliessen):
# model_denylist = ["openai/gpt-3*", "*free*"]
#
# Wildcards: * = beliebige Zeichenfolge, Muster gegen die volle model.id

[profiles.default]
weights = { cost = 0.30, latency = 0.20, context = 0.15, preference = 0.20, quality = 0.15 }
preferences = [
    "Qwen3.6-35B-A3B-bf16",
    "gpt-oss-20b-MXFP4-Q8",
    "gemma-4-26B-A4B-it-MLX-8bit",
    "gemma-4-e2b-it-4bit",
]
# :free-Varianten haben enge Provider-Constraints und scheitern oft an
# Tool-Parametern. Wenn der Caller `:free` will, ueber `cheap` oder explizit pinnen.
model_denylist = ["*:free"]
# require_parameters = false: OpenRouter darf unsupported Params silently droppen
# statt 404 zu werfen. Das ist Tradeoff fuer Robustheit bei pi-aehnlichen Clients.
provider_require_parameters = false

[profiles.cheap]
weights = { cost = 0.9, latency = 0.05, context = 0.05, preference = 0.0 }
max_price_out_per_mtok = 2.0
provider_sort = "price"
provider_require_parameters = true

[profiles.fast]
weights = { cost = 0.1, latency = 0.7, context = 0.1, preference = 0.1 }
max_latency_p95_ms = 1500
provider_sort = "latency"
provider_require_parameters = true

[profiles.private]
weights = { cost = 0.2, latency = 0.2, context = 0.2, preference = 0.4 }
require_privacy_class = ["Local", "Zdr"]
provider_zdr = true
provider_allow_fallbacks = false
provider_data_collection = "deny"
provider_require_parameters = true

[profiles.smart]
weights = { cost = 0.0, latency = 0.10, context = 0.20, preference = 0.20, quality = 0.50 }
preferences = [
    "anthropic/claude-opus-4-7",
    "anthropic/claude-opus-4-6",
    "openai/gpt-5",
    "google/gemini-2.5-pro",
]
# Hard-Filter: nur Modelle mit AA-Intelligence-Index >= diesem Wert.
# Greift nur, wenn registry.intelligence.enabled = true und AA-Daten verfügbar sind.
# min_intelligence_index = 50.0
provider_require_parameters = true
# provider_quantizations greift nur fuer Open-Weight-Modelle (Llama, Qwen, ...)
# und wuerde proprietaere Modelle wie Claude/GPT/Gemini ausfiltern. Wenn du
# speziell Open-Weight-Varianten bevorzugen willst, aktiviere es in einem
# eigenen Profil, z. B. [profiles.smart_open_weight].
# provider_quantizations = ["fp16", "bf16", "fp8"]

[profiles.local]
weights = { cost = 0.0, latency = 0.5, context = 0.2, preference = 0.3 }
backend_allowlist = ["OMlx"]
preferences = [
    "qwen3-32b",
    "llama-3.3-70b",
    "qwen2.5-coder-32b",
]
